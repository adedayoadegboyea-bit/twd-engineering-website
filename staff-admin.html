<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Staff Management | TW&D Admin</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="staff-directory.css"></head><body><main class="container staff-admin"><a href="about.html">← About Us</a><h1>Staff Directory Management</h1><p>Only authorised administrators can publish staff profiles. Changes appear on About Us after saving.</p><section id="loginPanel"><h2>Administrator sign in</h2><form id="loginForm"><label>Email <input type="email" name="email" required autocomplete="username"></label><label>Password <input type="password" name="password" required autocomplete="current-password"></label><button class="btn btn-red">Sign in</button></form></section><section id="editorPanel" hidden><button type="button" id="logout" class="btn btn-outline">Sign out</button><h2>Add or edit a staff member</h2><form id="staffForm"><input type="hidden" name="id"><label>Full name <input name="full_name" required maxlength="120"></label><label>Job title / position <input name="job_title" required maxlength="120"></label><label>Staff duties <textarea name="duties" required minlength="5" maxlength="1200" rows="5"></textarea></label><label>Portrait photo (JPG, PNG or WebP; max 5 MB) <input name="photo" type="file" accept="image/jpeg,image/png,image/webp"></label><label>Display order <input name="sort_order" type="number" value="0"></label><label class="staff-check"><input name="is_published" type="checkbox"> Publish on About Us</label><button class="btn btn-red" type="submit">Save staff profile</button><button class="btn btn-outline" type="reset">Clear form</button></form><h2>Existing staff</h2><div id="staffAdminList"></div></section><p id="adminMessage" role="status" aria-live="polite"></p></main><script type="module" src="staff-admin.js"></script></body></html>
