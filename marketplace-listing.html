<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TW&D Marketplace Listing</title><link rel="stylesheet" href="marketplace.css"><link rel="stylesheet" href="site-flow.css?v=20260928-1"><style>.detail-page{padding:70px 0;background:#f7f9fc;min-height:100vh}.detail-shell{width:min(1050px,92%);margin:auto;background:#fff;padding:30px;border-radius:18px;box-shadow:0 20px 60px #10233d18}.detail-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:30px}.hero-img{width:100%;height:480px;object-fit:cover;border-radius:14px;background:#eef3f7}.thumbs{display:flex;gap:8px;overflow:auto;margin-top:9px}.thumbs img{width:70px;height:55px;object-fit:cover;border-radius:7px;cursor:pointer}.price{font-size:30px}.seller{padding:18px;background:#f6f8fb;border-radius:13px;margin-top:22px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions a,.actions button{padding:10px 13px;border:0;border-radius:7px;background:#071d38;color:#fff;text-decoration:none;font-weight:900;cursor:pointer}.actions .wa{background:#16805b}.chat{margin-top:20px}.chat textarea{width:100%;min-height:100px;padding:11px;border:1px solid #dce4ed;border-radius:8px;font:inherit}@media(max-width:800px){.detail-grid{grid-template-columns:1fr}.hero-img{height:320px}}</style><style>.mp-back-button{padding:9px 12px;border:1px solid #dce4ed;border-radius:7px;background:#fff;color:#071d38;font-weight:900;cursor:pointer}.message-list{display:grid;gap:8px;margin:12px 0}.message{padding:10px;border-radius:10px;background:#f3f6f9}.message small{color:#65758a}</style></head><body><header class="mp-header"><div class="mp-container mp-nav"><a class="mp-brand" href="marketplace.html"><img src="assets/twd-luxury-logo.svg" alt="TW&D Engineering Consult & Services Ltd"><span>MARKETPLACE</span></a><nav><button type="button" class="mp-back-button" id="backButton">← Back to previous page</button><a href="marketplace.html">Browse Listings</a><a href="marketplace-account.html">My Account</a></nav></div></header><main class="detail-page"><div class="detail-shell" id="app">Loading listing…</div></main><script>
const ENDPOINT="https://script.google.com/macros/s/AKfycbzyZ5-txUUqM-O9T0RysHtcTQDfZAz2pgERT3NeKgGSJHnNaql-ZmKmguOYP2TT1IH5/exec";const KEY="twd_marketplace_session_token";const esc=v=>String(v||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));const money=v=>{const n=Number(v||0);return n>0?new Intl.NumberFormat("en-NG",{style:"currency",currency:"NGN",maximumFractionDigits:0}).format(n):"Contact seller"};const image=v=>{const s=String(v||"");const m=s.match(/[?&]id=([^&]+)/i)||s.match(/file\/d\/([^/]+)/i);return m?"https://drive.google.com/thumbnail?id="+encodeURIComponent(m[1])+"&sz=w1600":s};
async function load(){
const params=new URLSearchParams(location.search),id=params.get("id"),requestedOwner=params.get("owner");
if(!id){document.querySelector("#app").textContent="Listing not found.";return}
let cached=null;try{cached=JSON.parse(sessionStorage.getItem("twd_marketplace_listing_"+String(id))||"null")}catch(e){}
if(cached&&(!requestedOwner||String(cached.accountId||cached.ownerId||"")===String(requestedOwner)))render(cached);
try{
const r=await fetch(ENDPOINT+"?action=listings&_="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);
const d=await r.json(),x=(d.listings||[]).find(a=>String(a.id)===String(id));
if(x){
if(requestedOwner&&String(x.accountId||x.ownerId||"")!==String(requestedOwner)){if(!cached)document.querySelector("#app").textContent="This listing is not linked to the requested seller account.";return}
sessionStorage.setItem("twd_marketplace_listing_"+String(id),JSON.stringify(x));render(x);return
}
if(!cached)document.querySelector("#app").textContent="This listing is no longer available.";
}catch(e){
console.error("Listing refresh failed:",e);
if(!cached)document.querySelector("#app").innerHTML='<div class="seller"><h2>Unable to refresh this listing</h2><p>Please return to Marketplace and open the listing again.</p><div class="actions"><a href="marketplace.html">← Back to Marketplace</a></div></div>';
}}
async function render(x){window.__listingData=x;const imgs=(Array.isArray(x.images)&&x.images.length?x.images:(x.image?[x.image]:[])).map(image);const wa=x.whatsappEnabled&&x.whatsappNumber?"https://wa.me/"+String(x.whatsappNumber).replace(/[^0-9]/g,"")+"?text="+encodeURIComponent("Hello, I am interested in: "+x.title):"";document.querySelector("#app").innerHTML='<div class="detail-grid"><div><img id="main" class="hero-img" src="'+esc(imgs[0]||"")+'" alt="'+esc(x.title)+'"><div class="thumbs">'+imgs.map(i=>'<img src="'+esc(i)+'" data-src="'+esc(i)+'">').join("")+'</div></div><div><span class="tag">'+esc(x.category)+'</span><h1>'+esc(x.title)+'</h1><div class="price">'+money(x.price)+'</div><p>'+esc(x.description||"")+'</p><p><strong>Location:</strong> '+esc(x.location||"")+'<br><strong>Condition:</strong> '+esc(x.condition||"")+'</p><section class="seller"><h2>'+esc(x.seller||"Seller")+'</h2><p><strong>Seller account:</strong> '+(x.accountId||x.ownerId?"Linked to owner account":"Legacy listing — owner account link unavailable")+'</p><div class="actions"><button id="profile">View Seller Profile</button><button id="contactSeller">CONTACT SELLER NOW</button>'+(x.phone?'<a href="tel:'+esc(x.phone)+'">Call Seller</a>':'<span>Phone hidden</span>')+(wa?'<a class="wa" href="'+esc(wa)+'" target="_blank" rel="noopener">WhatsApp Seller</a>':"")+'</div></section><section class="chat"><h3>Chat with Seller</h3><p>Create or sign in to a marketplace account to send a private enquiry.</p><div id="thread" class="message-list"></div><textarea id="msg" placeholder="Write your enquiry..."></textarea><button id="send">Send Message</button><p id="status" class="status"></p></section></div></div>';document.querySelectorAll(".thumbs img").forEach(t=>t.onclick=()=>document.querySelector("#main").src=t.dataset.src);document.querySelector("#profile").onclick=()=>profile(x.accountId||x.ownerId);document.querySelector("#contactSeller").onclick=()=>{if(!localStorage.getItem(KEY)){location.href="marketplace-account.html?next=listing";return}document.querySelector("#msg").focus();document.querySelector(".chat").scrollIntoView({behavior:"smooth",block:"start"});};document.querySelector("#send").onclick=()=>send(x);loadChat(x)}
async function profile(id){if(!id){alert("Seller account is not linked to this older listing.");return}const d=await (await fetch(ENDPOINT+"?action=seller&userId="+encodeURIComponent(id))).json();if(d.ok)alert((d.seller.user.businessName||d.seller.user.fullName)+"\\nApproved listings: "+d.seller.approvedListings+"\\n"+(d.seller.user.bio||""));else alert("Seller profile unavailable.")}
async function loadChat(x){
const t=localStorage.getItem(KEY),thread=document.querySelector("#thread");if(!thread)return;
if(!t){thread.innerHTML="<div class='message'><strong>Buyer account required.</strong><br>Create a free Marketplace account or sign in to chat with this seller.</div>";return}
try{
const res=await fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"messages",sessionToken:t})});
const d=await res.json();if(!d.ok)throw new Error(d.message||"Unable to load messages.");
const rows=(d.messages||[]).filter(m=>String(m.listingId)===String(x.id));
thread.innerHTML=rows.map(m=>"<div class='message "+(String(m.fromUserId)===String(x.accountId||x.ownerId)?"seller-message":"buyer-message")+"'><small>"+esc(m.otherName||"Marketplace contact")+" • "+esc(m.timestamp)+"</small><div>"+esc(m.message)+"</div></div>").join("")||"<div class='message'>No messages yet. Start the conversation below.</div>";
thread.scrollTop=thread.scrollHeight;
}catch(e){console.error(e);thread.innerHTML="<div class='message'>Conversation could not be loaded. Please try again.</div>"}
}
async function send(x){const t=localStorage.getItem(KEY),m=document.querySelector("#msg").value.trim(),o=document.querySelector("#status");if(!t){location.href="marketplace-account.html?next=listing";return}if(!m){o.textContent="Write a message first.";return}const recipient=String(x.accountId||x.ownerId||"").trim()||"MARKETPLACE_ADMIN";const d=await (await fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"send_message",sessionToken:t,toUserId:recipient,listingId:x.id,message:m})})).json();o.textContent=d.message||"Message sent.";if(d.ok){document.querySelector("#msg").value="";loadChat(x)}}document.querySelector("#backButton").onclick=()=>{if(history.length>1)history.back();else location.href="marketplace.html"};let chatTimer=null;load().then(()=>{chatTimer=setInterval(()=>{const current=window.__listingData;if(current)loadChat(current)},5000)});
</script></body></html>
