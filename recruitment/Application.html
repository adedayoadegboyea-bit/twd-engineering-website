<!doctype html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{font-family:Arial,sans-serif;background:#f5f8fb;color:#062b59;margin:0}.wrap{max-width:850px;margin:auto;padding:30px}.card{background:#fff;padding:28px;border-radius:12px;box-shadow:0 8px 28px #062b5914}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{font-size:12px;font-weight:bold}input,select,textarea{width:100%;box-sizing:border-box;margin-top:6px;padding:12px;border:1px solid #ccd8e5;border-radius:6px;font:inherit}textarea{min-height:140px}.full{grid-column:1/-1}button{background:#062b59;color:#f7bd18;border:0;padding:14px 22px;border-radius:6px;font-weight:bold;cursor:pointer}.note{font-size:11px;color:#6c7d91;line-height:1.6}.msg{margin-top:15px;padding:12px;background:#eef7ee;display:none}.hidden{display:none}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class="wrap"><div class="card"><h1>TW&D Job Application</h1><p class="note">Complete the form carefully. Select the position you are applying for. If the required role is not listed, choose “Other Position as Required” and specify it.</p><form id="f"><div class="grid">
<div><label>Full Name<input name="name" required></label></div><div><label>Email<input type="email" name="email" required></label></div>
<div><label>Phone<input name="phone" required></label></div><div><label>Position Applied For<select name="position" id="position" required>
<option value="">Select a position</option>
<option>Site Engineer / Project Engineer</option>
<option>Civil Engineering Technician</option>
<option>Electrical Engineering Technician</option>
<option>Plumber / Building Services Technician</option>
<option>Quantity Surveying / Estimating Support</option>
<option>Project Administration / Documentation</option>
<option>Accounts / Office Support</option>
<option>Skilled Construction Workers</option>
<option>Driver</option>
<option>Personal Assistant</option>
<option>Cleaner / Office Assistant</option>
<option>Other Position as Required</option>
</select></label></div>
<div id="otherPositionWrap" class="hidden"><label>Specify Position<input name="otherPosition" id="otherPosition" placeholder="Enter the position you wish to apply for"></label></div>
<div><label>Current Location<input name="location" required></label></div><div><label>Professional Registration / Certification<input name="registration"></label></div>
<div class="full"><label>Qualifications<textarea name="qualifications" required></textarea></label></div><div class="full"><label>Relevant Experience<textarea name="experience" required></textarea></label></div><div class="full"><label>Application / Cover Letter<textarea name="letter" required></textarea></label></div>
<div><label>CV (PDF/DOC)<input type="file" id="cv" accept=".pdf,.doc,.docx" required></label></div><div><label>Supporting Document (optional)<input type="file" id="supporting" accept=".pdf,.doc,.docx"></label></div>
<div class="full"><button type="submit">Submit Application</button><div id="msg" class="msg"></div></div></div></form></div></div><script>
const position=document.querySelector('#position'),otherWrap=document.querySelector('#otherPositionWrap'),otherInput=document.querySelector('#otherPosition');
position.addEventListener('change',()=>{const other=position.value==='Other Position as Required';otherWrap.classList.toggle('hidden',!other);otherInput.required=other;if(!other)otherInput.value='';});
const fileData=f=>new Promise((resolve,reject)=>{if(!f)return resolve(null);const r=new FileReader();r.onload=()=>resolve({name:f.name,mimeType:f.type,base64:r.result.split(',')[1]});r.onerror=reject;r.readAsDataURL(f)});
document.querySelector('#f').addEventListener('submit',async e=>{e.preventDefault();const btn=e.target.querySelector('button');btn.disabled=true;btn.textContent='Submitting...';const d=Object.fromEntries(new FormData(e.target).entries());try{d.cv=await fileData(document.querySelector('#cv').files[0]);d.supporting=await fileData(document.querySelector('#supporting').files[0]);if(d.position==='Other Position as Required'&&d.otherPosition)d.position='Other: '+d.otherPosition.trim();delete d.otherPosition;google.script.run.withSuccessHandler(r=>{const m=document.querySelector('#msg');m.style.display='block';m.textContent='Application submitted successfully. Your reference is '+r.id+'. A confirmation email has been sent.';e.target.reset();otherWrap.classList.add('hidden');otherInput.required=false;btn.disabled=false;btn.textContent='Submit Application'}).withFailureHandler(err=>{alert(err.message||err);btn.disabled=false;btn.textContent='Submit Application'}).submitApplication(d)}catch(err){alert(err);btn.disabled=false;btn.textContent='Submit Application'}});
</script></body></html>
