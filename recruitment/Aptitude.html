<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<base target="_top">
<title>TW&D Aptitude Test</title>
<style>
body{margin:0;background:#f5f7fa;color:#172335;font-family:Inter,Arial,sans-serif}.wrap{max-width:980px;margin:0 auto;padding:40px 18px}.card{background:#fff;border-radius:16px;padding:32px;box-shadow:0 15px 45px rgba(0,0,0,.08)}h1,h2{color:#062b59}.brand{font-weight:900;letter-spacing:.5px;color:#062b59}.gold{color:#c99800}.login{max-width:560px;margin:30px auto}.field{margin:16px 0}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:7px}.field input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ccd7e3;border-radius:8px;font:inherit}button{background:#062b59;color:#f7bd18;border:0;border-radius:8px;padding:14px 20px;font-weight:800;cursor:pointer}button:disabled{opacity:.6;cursor:not-allowed}.msg{margin-top:15px;padding:12px;border-radius:8px;background:#fff5f5;color:#9a2222;display:none}.exam{display:none}.examhead{display:flex;justify-content:space-between;align-items:center;gap:15px;border-bottom:1px solid #e1e7ef;padding-bottom:18px}.timer{font-size:28px;font-weight:900;color:#b21f1f}.question{padding:18px 0;border-bottom:1px solid #e5ebf2}.question p{font-weight:800}.option{display:block;margin:10px 0;font-weight:400}.result{margin-top:18px;padding:18px;background:#eef7ee;border-radius:10px}@media(max-width:650px){.card{padding:22px}.examhead{display:block}.timer{margin-top:12px}}
</style>
</head>
<body><div class="wrap"><div class="card">
<div class="brand">TW&amp;D ENGINEERING CONSULT &amp; SERVICES LTD</div>
<section id="login" class="login">
<h1>Take Your Aptitude Test</h1>
<p>Enter the login details sent to you after your recruitment application was approved.</p>
<div class="field"><label>Username</label><input id="username" autocomplete="username"></div>
<div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div>
<button id="loginBtn" type="button">Login &amp; Start Aptitude Test</button>
<div id="loginMsg" class="msg"></div>
</section>
<section id="exam" class="exam">
<div class="examhead"><div><h2>AI Aptitude Test</h2><p id="candidateInfo">Applicant information loading...</p><p>50 position-related questions • 1 hour • one submission</p></div><div id="timer" class="timer">60:00</div></div>
<div id="questions"></div><button id="submitExam" type="button">Submit Aptitude Test</button><div id="examResult" class="result" style="display:none"></div>
</section>
</div></div>
<script>
let test=null,timerHandle=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function showMsg(t){const m=document.querySelector('#loginMsg');m.style.display='block';m.textContent=t;}
function renderExam(data){if(!data||!data.ok)throw new Error((data&&data.message)||'Unable to start the aptitude test.');test=data;document.querySelector('#candidateInfo').innerHTML='<strong>Position:</strong> '+esc(data.position)+' &nbsp; | &nbsp; <strong>Email:</strong> '+esc(data.email);document.querySelector('#login').style.display='none';document.querySelector('#exam').style.display='block';document.querySelector('#questions').innerHTML=data.questions.map((q,i)=>'<div class="question"><p>'+(i+1)+'. '+esc(q.question)+'</p>'+q.options.map((o,j)=>'<label class="option"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+'. '+esc(o)+'</label>').join('')+'</div>').join('');startTimer(new Date(data.expiresAt).getTime());}
function startTimer(end){clearInterval(timerHandle);const tick=()=>{const left=Math.max(0,end-Date.now()),m=Math.floor(left/60000),s=Math.floor(left/1000)%60;document.querySelector('#timer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(left<=0){clearInterval(timerHandle);submitExam(true);}};tick();timerHandle=setInterval(tick,1000);}
function submitExam(force){if(!test)return;const answers=[];for(let i=0;i<50;i++){const x=document.querySelector('input[name="q'+i+'"]:checked');answers.push(x?Number(x.value):-1);}const unanswered=answers.filter(v=>v<0).length;if(!force&&unanswered){alert('Please answer all 50 questions before submitting. Questions left unanswered: '+unanswered);return;}const b=document.querySelector('#submitExam');b.disabled=true;b.textContent=force?'Time expired — submitting...':'Submitting and marking...';google.script.run.withSuccessHandler(r=>{clearInterval(timerHandle);const box=document.querySelector('#examResult');box.style.display='block';box.innerHTML='<strong>Submitted successfully.</strong><p>Your aptitude test has been received. The score and AI assessment have been sent to TW&amp;D management for review.</p><p>The final recruitment result will be communicated within 24 hours.</p>';document.querySelectorAll('#questions input').forEach(x=>x.disabled=true);}).withFailureHandler(e=>{b.disabled=false;b.textContent='Submit Aptitude Test';alert((e&&e.message)||e);}).submitAptitudeTest(test.testId,answers);}
document.querySelector('#loginBtn').onclick=()=>{const b=document.querySelector('#loginBtn');b.disabled=true;b.textContent='Checking login...';google.script.run.withSuccessHandler(renderExam).withFailureHandler(e=>{showMsg((e&&e.message)||String(e));b.disabled=false;b.textContent='Login & Start Aptitude Test';}).loginAptitude(document.querySelector('#username').value,document.querySelector('#password').value);};
document.querySelector('#submitExam').onclick=()=>submitExam(false);
</script></body></html>
