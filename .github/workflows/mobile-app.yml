name: Build TW&D Engineering Mobile App

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-app/package.json
      - run: npm install
      - run: npm run build:web
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build Android debug APK
        working-directory: mobile-app/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: twd-engineering-android-debug
          path: mobile-app/android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-app/package.json
      - run: npm install
      - run: npm run build:web
      - run: npx cap add ios
      - run: npx cap sync ios
      - name: Build iOS simulator app
        working-directory: mobile-app
        run: xcodebuild -workspace ios/App/App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        with:
          name: twd-engineering-ios-simulator
          path: mobile-app/build/Build/Products/Debug-iphonesimulator/App.app
