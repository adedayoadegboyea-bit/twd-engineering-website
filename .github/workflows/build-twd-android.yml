name: Build TW&D Engineering Android Test APK

on:
  push:
    paths:
      - 'mobile-app/**'
      - '.github/workflows/build-twd-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install mobile dependencies
        working-directory: mobile-app
        run: npm install

      - name: Prepare offline web assets
        working-directory: mobile-app
        run: npm run build:web

      - name: Add Android platform
        working-directory: mobile-app
        run: npx cap add android

      - name: Synchronize Capacitor Android project
        working-directory: mobile-app
        run: npx cap sync android

      - name: Build installable Android debug APK
        working-directory: mobile-app/android
        shell: bash
        run: |
          ./gradlew assembleDebug --no-daemon
          cp "app/build/outputs/apk/debug/app-debug.apk" "app/build/outputs/apk/debug/TWD-Engineering-TEST.apk"

      - name: Publish tested APK to website downloads
        shell: bash
        run: |
          mkdir -p downloads
          cp "mobile-app/android/app/build/outputs/apk/debug/TWD-Engineering-TEST.apk" "downloads/twd-engineering.apk"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/twd-engineering.apk
          if git diff --cached --quiet; then
            echo "Published APK is already up to date."
          else
            git commit -m "Publish latest tested TW&D Android APK"
            git push
          fi

      - name: Upload installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: twd-engineering-installable-test-apk
          path: mobile-app/android/app/build/outputs/apk/debug/TWD-Engineering-TEST.apk
          if-no-files-found: error
          retention-days: 30
