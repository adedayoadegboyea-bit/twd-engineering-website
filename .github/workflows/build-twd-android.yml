name: Build TW&D Engineering Android App

on:
  push:
    paths:
      - 'mobile-app/**'
      - '.github/workflows/build-twd-android.yml'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install mobile dependencies
        working-directory: mobile-app
        run: npm install

      - name: Prepare offline web assets
        working-directory: mobile-app
        run: npm run build:web

      - name: Add Android platform
        working-directory: mobile-app
        run: npx cap add android

      - name: Synchronize Capacitor Android project
        working-directory: mobile-app
        run: npx cap sync android

      - name: Create company release signing key
        working-directory: mobile-app/android
        shell: bash
        run: |
          KEYSTORE_PASSWORD="$(openssl rand -hex 24)"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          keytool -genkeypair -v \
            -keystore twd-release.keystore \
            -alias twd-engineering \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            -dname 'CN=TW&D Engineering, OU=Engineering, O=TW&D Engineering Consult & Services Ltd, L=Ibadan, ST=Oyo, C=NG'

      - name: Configure Android release signing
        working-directory: mobile-app/android
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle")
          s = p.read_text()
          if "signingConfigs {" not in s:
              marker = "    buildTypes {"
              block = """    signingConfigs {
                  release {
                      storeFile file("../twd-release.keystore")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias "twd-engineering"
                      keyPassword System.getenv("KEYSTORE_PASSWORD")
                  }
              }
          """
              if marker not in s:
                  raise SystemExit("Could not locate Android buildTypes block.")
              s = s.replace(marker, block + marker, 1)
          target = "    buildTypes {\n        release {"
          if "signingConfig signingConfigs.release" not in s:
              if target not in s:
                  raise SystemExit("Could not locate Android buildTypes.release block.")
              s = s.replace(target, target + "\n            signingConfig signingConfigs.release", 1)
          p.write_text(s)
          PY

      - name: Build Android release APK
        working-directory: mobile-app/android
        shell: bash
        run: |
          ./gradlew clean assembleRelease --no-daemon
          cp "app/build/outputs/apk/release/app-release.apk" "app/build/outputs/apk/release/TWD-Engineering.apk"

      - name: Upload company-named release APK
        uses: actions/upload-artifact@v4
        with:
          name: twd-engineering-company-release
          path: mobile-app/android/app/build/outputs/apk/release/TWD-Engineering.apk
          if-no-files-found: error
          retention-days: 30
