name: Refresh Nigeria Today news

on:
  push:
    branches: [main]
    paths:
      - "scripts/build_news.py"
      - ".github/workflows/news-feed.yml"
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build news feed
        run: python scripts/build_news.py
      - name: Commit refreshed feed
        run: |
          git config user.name "TW&D News Bot"
          git config user.email "actions@github.com"
          git add news.json
          git diff --cached --quiet || git commit -m "Refresh Nigeria Today news feed"
          git push
